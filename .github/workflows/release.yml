# Publish to NuGet when a v* tag is pushed.
#
# Directory.Build.props is the single source of truth for the version — the tag is checked
# against it rather than driving it, so a mistyped tag fails before anything is pushed.
# The packages themselves are discovered from the pack output, so a future satellite package
# is picked up without editing this file.
#
#   git tag v5.0.2 && git push origin v5.0.2
#
# Publishing uses Trusted Publishing (OIDC): no long-lived API key exists in this repository.
# GitHub signs a short-lived token proving which workflow in which repository is running,
# nuget.org validates it against a policy you configure there, and issues an API key valid for
# one hour. A compromise of this repository's secrets yields nothing that can publish.
#
# Two jobs on purpose: everything that can fail runs unattended, and only the push waits behind
# the environment's approval gate. A reviewer is asked once the full suite has already passed,
# and no OIDC token is minted until they approve.
#
# Setup, once:
#   1. GitHub → Settings → Environments → create `nuget`, and add yourself under
#      "Required reviewers" (without a reviewer the environment adds no gate).
#   2. nuget.org → your account → Trusted Publishing → add a policy naming this repository
#      owner, this repository, the workflow *file name* (release.yml, not a path), and the
#      environment `nuget`. The environment must match: the OIDC token carries it as a claim,
#      and a policy that does not expect it will not match.
#   3. Add a NUGET_USER secret holding your nuget.org *profile name* — not the email address.
#      This is not a credential; it is a secret only to keep it out of build logs. A repository
#      secret is fine, or scope it to the `nuget` environment.

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and pack, but do not push to NuGet"
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest

    permissions:
      contents: read   # deliberately no id-token here: nothing in this job may mint a token

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # MSBuild evaluation rather than parsing the XML, so the value is exactly what the build
      # will stamp onto the packages.
      - name: Resolve version
        id: version
        run: |
          version="$(dotnet msbuild src/EFCore.ComplexIndexes/EFCore.ComplexIndexes.csproj -getProperty:Version)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not evaluate the Version property."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.version.outputs.version }}"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag v$tag does not match Directory.Build.props ($version) — bump the version and re-tag rather than publishing a version nothing documents."
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release

      # The full suite gates the release, which also means ChangelogConsistencyTests runs:
      # a version with no changelog entry in the root or package READMEs fails here.
      # CI=true keeps the integration layer mandatory.
      - name: Test
        env:
          CI: true
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -o dist

      # Installs the packages just packed into a throwaway project outside this repository and runs a
      # real `dotnet ef migrations add`. Passing dist means the artifacts published are the artifacts
      # tested, rather than a fresh pack that happens to be built from the same commit.
      - name: Consumer smoke test
        run: ./test/consumer-smoke-test.sh dist

      # One CycloneDX SBOM per package, describing what a consumer actually takes on.
      #
      # --exclude-filter drops Microsoft.EntityFrameworkCore.Design and its whole subtree. That
      # reference is PrivateAssets=all, so it never reaches consumers — leaving it in would list
      # ~45 MSBuild/Roslyn components for a package whose nuspec declares one, and hand every
      # consumer a pile of vulnerability alerts for code they do not ship. PackagingConventionTests
      # asserts this filter still covers every PrivateAssets=all reference.
      #
      # --include-project-references keeps the core package listed as a dependency of the
      # satellites, matching their nuspec.
      - name: Generate SBOMs
        run: |
          dotnet tool restore
          for directory in src/*/; do
            id="$(basename "$directory")"
            echo "==> $id"
            dotnet cyclonedx "$directory$id.csproj" \
              --output dist \
              --filename "$id.${{ steps.version.outputs.version }}.cdx.json" \
              --output-format Json \
              --set-type Library \
              --set-nuget-purl \
              --set-name "$id" \
              --set-version "${{ steps.version.outputs.version }}" \
              --include-project-references \
              --exclude-filter Microsoft.EntityFrameworkCore.Design
          done

      - name: Collect packages
        run: |
          shopt -s nullglob
          packages=(dist/*."${{ steps.version.outputs.version }}".nupkg)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::No *.${{ steps.version.outputs.version }}.nupkg found in dist/."
            exit 1
          fi
          printf 'Packages (%d):\n' "${#packages[@]}"
          printf '    %s\n' "${packages[@]##*/}"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: |
            dist/*.nupkg
            dist/*.snupkg
            dist/*.cdx.json

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: verify

    # Skipped entirely on a dry run, so no approval is requested and no token is minted.
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}

    # The approval gate. Must match the environment named in the nuget.org policy.
    environment: nuget

    permissions:
      contents: read
      id-token: write   # lets GitHub mint the OIDC token nuget.org validates

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Publishes exactly what was verified — the packages are not rebuilt here.
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nupkg-${{ needs.verify.outputs.version }}
          path: dist

      - name: Verify the publisher identity is configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "${NUGET_USER:-}" ]]; then
            echo "::error::NUGET_USER secret is not set — it must be your nuget.org profile name, not the email address."
            exit 1
          fi

      # Exchanges this run's OIDC token for an API key that nuget.org issues against the trusted
      # publishing policy, valid for one hour. The token is single-use and nothing is stored.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Only .nupkg is globbed — dotnet nuget push uploads the matching .snupkg alongside it
      # automatically, so symbols need no separate step.
      #
      # --skip-duplicate makes a re-run after a partial failure safe: already-published
      # packages are reported and skipped instead of failing the job. The temporary key expires
      # an hour after login, so a much-delayed re-run needs a fresh workflow run.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in dist/*."${{ needs.verify.outputs.version }}".nupkg; do
            echo "==> Pushing $(basename "$package")"
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done

      - name: Summary
        run: |
          {
            echo "### Released ${{ needs.verify.outputs.version }}"
            echo
            for package in dist/*."${{ needs.verify.outputs.version }}".nupkg; do
              echo "- \`$(basename "$package")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
