# Build and test on every push to main or a release branch, and every PR into either.
# Two lines are supported (CONTRIBUTING.md#branches-and-releases), and each branch that ships one
# needs the same checks: release/5.x holds the 5.x LTS line, cut from the v5.5.0 tag, and main the
# SchemaKit line, which tags its 11.0.0-preview.N releases on main.
#
# Split into jobs on purpose: the unit suite and one integration job per database, which need
# Docker for their PostgreSQL and SQL Server containers.
#
# Also a reusable workflow (#111). release.yml calls it before it packs anything, so a release runs
# every lane this file has, and the `CI` gate decides for it exactly as it does for a PR; nightly.yml
# calls it on the default branch, so inputs that change without a diff (the floating container
# images, nuget.org, the SDK's patch level) are caught within a day rather than by the next PR.
#
# The SDK comes from global.json: the 10.0.4xx band, latest patch. A new feature band changes the
# compiler and NuGet under every job, so it arrives as a PR that edits global.json, not overnight.
#
# Actions are pinned to commit SHAs, not tags. A tag can be moved to a different commit — that is
# how the tj-actions/changed-files compromise (March 2025) reached every workflow that trusted
# `@v45` — a SHA cannot. The trailing `# vX.Y.Z` is what Dependabot reads to propose an update,
# so keep it next to the SHA (see .github/dependabot.yml).
#
# For information on GitHub Actions with .NET, see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A new push to a PR makes the in-flight run pointless; main is never cancelled.
#
# The `dotnet-` prefix keeps this group apart from a caller's. Called from another workflow,
# `github.workflow` is the caller's name, so without it the group could equal the caller's own,
# and each would wait for the other to finish.
concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux only. The matrix is kept as a single entry rather than flattened to a plain `runs-on`
    # so the job keeps reporting as `Test (ubuntu-latest)`, which branch protection required until
    # the `CI` gate below replaced the per-lane checks. Re-adding an OS is a one-line change here.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # The default build is the floor the packages declare (#133). Read from what the test host
      # loads, because a provider pinned higher pulls EF Core up behind it: until 5.5.0 a Sqlite pin
      # at 10.0.11 ran every lane on EF Core 10.0.11 beside Npgsql EF 10.0.0, a mix no consumer has.
      - name: Dependency versions are the floor
        run: >
          test/assert-dependency-versions.sh
          test/EFCore.ComplexIndexes.Tests/bin/Release/net10.0/EFCore.ComplexIndexes.Tests.deps.json
          10.0.0 10.0.0

      # This used to fan out across ubuntu/windows/macos for the repository-convention tests, which
      # do real path work. Dropped as unearned: no shipped code touches the filesystem, so the only
      # thing the other runners proved was that the *test harness* composes paths portably — which
      # it does via Path.Combine, and which fails loudly on the machine of whoever hits it. Fix that
      # reactively if a Windows contributor ever appears.
      - name: Unit tests
        run: >
          dotnet test -c Release --no-build
          --filter "TestCategory!=Integration"
          --logger "trx;LogFileName=unit-${{ matrix.os }}.trx"
          --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore

  integration:
    name: Integration (PostgreSQL 18)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # CI=true turns an unavailable container into a failure instead of an inconclusive skip.
      # Without it a broken Docker setup would retire the end-to-end layer and still report green.
      - name: Integration tests
        env:
          CI: true
        run: >
          dotnet test -c Release --no-build
          --filter "TestCategory=Integration&TestCategory!=SqlServer"
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults

      # postgres:18 and postgres:16 float within their major, as a consumer's server does. The
      # nightly run is what notices a new minor; this records which image each run used, so a run
      # that fails with no diff can be compared with the last green one.
      - name: Record the container images
        if: always()
        run: |
          {
            echo "### Container images"
            echo
            docker image ls --digests --format '- `{{.Repository}}:{{.Tag}}` `{{.Digest}}`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results-integration
          path: TestResults/*.trx
          if-no-files-found: ignore

  # Applies the SQL Server satellite's migrations to a live SQL Server 2022 and reads the indexes
  # back (#100). Rendered SQL cannot show what the server refuses: #84, #88 and #90 each passed
  # every SQL-text test and failed only here. A job of its own, so it reports as its own line in the
  # `CI` gate and a slow SQL Server image start does not hold up the PostgreSQL lane. The image is
  # amd64 only.
  integration-sqlserver:
    name: Integration (SQL Server 2022)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # CI=true, as above: an unavailable container fails the job instead of going inconclusive.
      - name: Integration tests
        env:
          CI: true
        run: >
          dotnet test -c Release --no-build
          --filter "TestCategory=Integration&TestCategory=SqlServer"
          --logger "trx;LogFileName=integration-sqlserver.trx"
          --results-directory TestResults

      # mssql/server:2022-latest floats across cumulative updates; recorded as in the PostgreSQL lane.
      - name: Record the container images
        if: always()
        run: |
          {
            echo "### Container images"
            echo
            docker image ls --digests --format '- `{{.Repository}}:{{.Tag}}` `{{.Digest}}`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results-integration-sqlserver
          path: TestResults/*.trx
          if-no-files-found: ignore

  # The only job that exercises the delivery chain rather than the code: NuGet restore, the packaged
  # .targets injecting the design-time attribute, EF's host discovering it, and a real
  # `dotnet ef migrations add`. Deliberately independent of the other jobs so it reports in parallel.
  #
  # No database is involved — scaffolding a migration never connects.
  consumer:
    name: Consumer smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Scaffold a migration from a throwaway consumer project
        run: ./test/consumer-smoke-test.sh

  # Every suite again, on the newest EF Core 10 and Npgsql EF patches on nuget.org (#133).
  #
  # The packages declare `[10.0.0, 11.0.0)`, so a consumer runs on whatever patch they restore, while
  # the other lanes test the floor. This package replaces EF's migrations differ and SQL generator
  # and uses its internal API in ten files, and EF internals carry no promise across patches. On
  # the 5.x line, which takes fixes only, nothing else would notice a patch that breaks it.
  #
  # The versions are looked up when the job runs rather than pinned here, so a new patch is tested
  # the night it ships (nightly.yml calls this workflow) without a PR that bumps a number. src/ is
  # still compiled against its floor: only the test projects float (test/Directory.Build.targets),
  # which is what a consumer on a newer patch runs.
  newest-patch:
    name: Newest EF Core patch
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # Npgsql EF 10.0.1 and later require EF Core 10.0.4 or later, so the two newest are a pair a
      # consumer can restore.
      - name: Find the newest patches
        run: |
          newest() {
            curl -fsSL "https://api.nuget.org/v3-flatcontainer/$1/index.json" \
              | jq -r '.versions[]' | grep -E '^10\.[0-9]+\.[0-9]+$' | sort -V | tail -n1
          }
          ef="$(newest microsoft.entityframeworkcore)"
          npgsql="$(newest npgsql.entityframeworkcore.postgresql)"
          if [[ -z "$ef" || -z "$npgsql" ]]; then
            echo "::error::nuget.org returned no 10.x version (EF Core '$ef', Npgsql EF '$npgsql')."
            exit 1
          fi
          echo "EF_FLOAT=$ef" >> "$GITHUB_ENV"
          echo "NPGSQL_EF_FLOAT=$npgsql" >> "$GITHUB_ENV"
          echo "### EF Core $ef, Npgsql EF $npgsql" >> "$GITHUB_STEP_SUMMARY"

      # Passed to the build as well, so it evaluates the references the restore resolved.
      - name: Restore dependencies
        run: dotnet restore -p:EfFloat="$EF_FLOAT" -p:NpgsqlEfFloat="$NPGSQL_EF_FLOAT"

      - name: Build
        run: dotnet build -c Release --no-restore -p:EfFloat="$EF_FLOAT" -p:NpgsqlEfFloat="$NPGSQL_EF_FLOAT"

      # A float that did not take leaves the floor in place, and every test then passes on it.
      - name: Dependency versions are the newest patches
        run: >
          test/assert-dependency-versions.sh
          test/EFCore.ComplexIndexes.Tests/bin/Release/net10.0/EFCore.ComplexIndexes.Tests.deps.json
          "$EF_FLOAT" "$NPGSQL_EF_FLOAT"

      # One step for the four suites, which runs each and fails after the last, so one red run
      # names every suite the patch breaks. The steps run under `bash -e`, so each suite's exit
      # status is caught by `if` rather than ending the step. CI=true makes an unavailable container
      # fail, as in the integration lanes. The smoke test runs last: it packs, and packing restores
      # without the float.
      - name: Tests
        env:
          CI: true
        run: |
          export SMOKE_EF_VERSION="$EF_FLOAT" SMOKE_NPGSQL_EF_VERSION="$NPGSQL_EF_FLOAT"
          failed=()
          suite() {
            local name="$1"
            shift
            echo "::group::$name"
            if "$@"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$name failed on EF Core $EF_FLOAT, Npgsql EF $NPGSQL_EF_FLOAT."
              failed+=("$name")
            fi
          }
          tests() {
            dotnet test -c Release --no-build --filter "$1" \
              --logger "trx;LogFileName=newest-patch-$2.trx" --results-directory TestResults
          }

          suite "Unit" tests "TestCategory!=Integration" unit
          suite "Integration (PostgreSQL)" tests "TestCategory=Integration&TestCategory!=SqlServer" postgres
          suite "Integration (SQL Server)" tests "TestCategory=Integration&TestCategory=SqlServer" sqlserver
          suite "Consumer smoke test" ./test/consumer-smoke-test.sh

          if (( ${#failed[@]} )); then
            echo "Failed: ${failed[*]}"
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results-newest-patch
          path: TestResults/*.trx
          if-no-files-found: ignore

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: [ test, integration, integration-sqlserver ]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # Packing is itself a check: a package that declares PackageReadmeFile without packing the
      # file fails here with NU5019, and satellites that lose their .targets ship silently broken.
      - name: Pack
        run: dotnet pack -c Release -o dist

      - name: List package contents
        run: |
          for package in dist/*.nupkg; do
            echo "=== $(basename "$package")"
            unzip -l "$package" | awk '{ print "    " $NF }' | grep -E 'README|targets|\.dll$' || true
          done

      # The smoke test's *other* invocation mode. The `consumer` job runs it with no argument, where
      # it packs its own feed; here it is handed a pre-built one, exactly as the release workflow
      # does. The two are not interchangeable — packing pre-populates NUGET_PACKAGES with the
      # solution's dependencies, and a restore that only works because of that side effect passes
      # one way and fails the other. That difference broke a release, because until now nothing
      # exercised this mode before release day.
      - name: Consumer smoke test against the packed feed
        run: ./test/consumer-smoke-test.sh dist

      # Generating here too means a broken SBOM step surfaces on a PR rather than on release day.
      - name: Generate SBOMs
        run: |
          dotnet tool restore
          version="$(dotnet msbuild src/EFCore.ComplexIndexes/EFCore.ComplexIndexes.csproj -getProperty:Version)"
          for directory in src/*/; do
            id="$(basename "$directory")"
            dotnet cyclonedx "$directory$id.csproj" \
              --output dist --filename "$id.$version.cdx.json" --output-format Json \
              --set-type Library --set-nuget-purl --set-name "$id" --set-version "$version" \
              --include-project-references --exclude-filter Microsoft.EntityFrameworkCore.Design
          done

      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nupkg
          path: |
            dist/*.nupkg
            dist/*.snupkg
            dist/*.cdx.json

  # The one required build check. Branch protection names this job and nothing else in this
  # workflow, so a new lane is a line in `needs` below rather than an edit to the protection of
  # every protected branch (main and release/5.x).
  #
  # Required checks cannot do this themselves: GitHub reports a skipped job as Success, even on a
  # required check, whether it was skipped by its own condition or because a job it needs failed.
  # So the gate runs whatever happened (`if: always()`) and passes only when every job it needs
  # reports `success`. Skipped and cancelled fail it, because no lane is meant to be skipped yet;
  # once lanes can be selected (#112) an unselected lane is the one skip it may accept.
  #
  # Keep the name: it is the required context, and a renamed job leaves the old name required and
  # never reported, which hangs every PR instead of failing it. WorkflowGateConventionTests holds
  # that every other job in this file is in `needs`.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [ test, integration, integration-sqlserver, consumer, newest-patch, pack ]
    if: always()

    steps:
      # Reads `needs` whole rather than naming the jobs again, so a lane added to `needs` is checked
      # without a second edit here.
      - name: Every lane succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          rows="$(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<<"$NEEDS")"
          if [[ -z "$rows" ]]; then
            echo "::error::The gate needs no jobs, so it would pass on nothing."
            exit 1
          fi

          failed=0
          {
            echo "| Job | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r job result; do
            echo "| \`$job\` | $result |" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$result" != "success" ]]; then
              echo "::error::$job: $result. Every lane must succeed; a skipped or cancelled lane fails the gate too."
              failed=1
            fi
          done <<<"$rows"
          exit "$failed"
