# Every PR carries one type label, a severity if it is a bug, and a closing reference to the issue
# it resolves (CONTRIBUTING.md#issues); a `silent` PR into a minor also carries its issue's row
# under "### Changed answers" in CHANGELOG.md (CONTRIBUTING.md#branches-and-releases). The rules
# live in .github/scripts/pr-hygiene.sh, which reads the event payload and two text files of the
# checkout, CHANGELOG.md and Directory.Build.props: no token, nothing of the PR's executed, and
# runnable locally. The sparse checkout is in cone mode, which always includes the root's files.
#
# Triggered on label and description edits as well as pushes, so adding the missing label turns the
# check green without a new commit. `pull_request`, not `pull_request_target`: a PR from a fork runs
# with a read-only token and never sees a secret.
#
# Actions are pinned to commit SHAs with the tag in a trailing comment, as in dotnet.yml.

name: PR hygiene

on:
  pull_request:
    branches: [ "main", "release/**", "net11" ]
    types: [ opened, edited, reopened, synchronize, labeled, unlabeled ]

permissions:
  contents: read

# Runs one at a time per PR, never cancelling one that has started (#207). Measured on #208 on
# 2026-10-29, which ran its own copy of this file. With `cancel-in-progress: true`, every run but the
# last was cancelled: 152 of the 200 before it. With no group, all ran, in parallel and finishing in
# any order, and a failing run of an older payload that finished after a passing one became the
# check's result: the PR showed the failure, though its labels were in order by then. Serialized,
# the run of the last event starts after every other has finished, so it decides the check. A
# waiting run is still cancelled when a newer one queues; it never started, and the newer one reads
# a later payload.
concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check:
    name: Labels and issue link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts
      - run: .github/scripts/pr-hygiene.sh "$GITHUB_EVENT_PATH"
